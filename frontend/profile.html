<!DOCTYPE html lang="en">
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICKCART</title>
    <link rel="stylesheet" href="user.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
     <header  id="header">
        <div class="name">
            <div class="logo">
                <img src="..\images\icons\cart-icon.png">
            </div> 
            <h1 id="header-name">QuickCart</h1> 
        </div>
        
        <nav id="nav-bar">
            <a class="nav-link" href="user.html">
                <i class="fa fa-3x fa-home"></i>
            </a>
            <a class="nav-link" href="cart.html">
                <i class="fa fa-3x fa-shopping-cart"></i>
            </a>
            <a class="nav-link" href="profile.html">
                <i class="fa fa-3x fa-user"></i>
            </a>
            <a class="nav-link" href="contact.html">
                <i class="fa fa-3x fa-comment"></i>
            </a>
        </nav>
     </header>

<div class="profile-container">
    <h2>User Profile</h2>
    <hr>

    <div>
        <label>Username:</label><br>
        <input type="text" id="username" readonly disabled>
    </div>
    <br>
    <div>
        <label>Email Address:</label><br>
        <input type="email" id="email" readonly disabled>
    </div>

    <div>
        <label>Phone Number:</label><br>
        <input type="text" id="phone" placeholder="Enter mobile number">
    </div>
    <br>
    <div>
        <label>Shipping Address:</label><br>
        <textarea id="address" rows="4" placeholder="Enter full address" maxlength="10"></textarea>
    </div>
    <br>
    <div>
        <label>Pincode:</label><br>
        <input type="text" id="pincode" placeholder="6-digit pincode">
    </div>
    <br>
    

    <br>
    <button id="updateBtn">Update Profile</button>

    <hr>

    <div class="profile-nav-links">
        <button id="myorder" onclick="window.location.href='orders.html'">My Orders</button>
        <button id="logoutBtn">Logout</button>
    </div>
    </div>
    <script src="../frontend/profile.js"></script>
      
  <footer>
        <p><strong>&copy; 2026 QuickCart. All rights reserved</strong></p>
</footer>
</body>
</html>
