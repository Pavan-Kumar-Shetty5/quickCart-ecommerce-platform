<!DOCTYPE html lang="en">
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICKCART</title>
    <link rel="stylesheet" href="user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
     <header  id="header">
        <div class="name">
            <div class="logo">
                <img src="\images\icons\cart-icon.png">
            </div> 
            <h1 id="header-name">QuickCart</h1> 
        </div>
        
        <nav id="nav-bar">
            <a class="nav-link" href="user.html">
                <i class="fa fa-3x fa-home"></i>
            </a>
            <a class="nav-link" href="cart.html">
                <i class="fa fa-3x fa-shopping-cart"></i>
            </a>
            <a class="nav-link" href="#About_us">
                <i class="fa fa-3x fa-user"></i>
            </a>
            <a class="nav-link" href="#About_us">
                <i class="fa fa-3x fa-comment"></i>
            </a>
        </nav>
     </header>
     <section class="search">
        <div class="search-grid">
            <div id="search-icon">
               <img src="\images\icons\search-icon.png">
            </div>
            <div id="search-text"></div>
               <input type="text" name="search" class="search-product" placeholder="search products">
            </div>
        </div>
    </section>
     <section class="category-content" id="shop">
            <h2 class="heading">Keep shopping for</h2>
            <div class="category-grid">
                <div class="category-nav">
                    <a href="product.html?category=electronics">
                        <img src="\images\electronics\iPhone-17-Pro-Max-Concept-Art-PNG.png">
                        <p>Electronics</p>
                    </a>
                </div>
                <div  class="category-nav">
                    <a href="product.html?category=fashions">
                        <img src="\images\fasions\Leather-Jacket-PNG-Pic.png">
                        <p>Fashion</p>
                    </a>
                </div>
                <div  class="category-nav">
                    <a href="product.html?category=kitchen">
                        <img src="\images\kitchen\Home-Kitchen-Appliances-PNG-Picture.png">
                        <p>Kitchen</p>
                    </a>
                </div>
                <div  class="category-nav">
                    <a href="product.html?category=furnitures">
                        <img src="\images\furniture\round-sunglasses-black.jpg">
                        <p>Furniture</p>
                    </a>
                </div>
                <div  class="category-nav">
                    <a href="product.html?category=footwears">
                        <img src="\images\footwears\Nike-Basketball-Shoes-Performance-Features-Overview-PNG.png">
                        <p>Footwears</p>
                    </a>
                </div>
            </div>
               
        </section> 
        <section class="product-browsing">
            <h2 class="heading">TOP PICKS FOR U</h2>
            <div class="product-grid">

            </div>
            
        </section>
    

        <footer>
            <p><strong>&copy; 2026 QuickCart. All rights reserved</strong></p>
        </footer>
        <script src="/Data/product.js"></script>
        <script src="/Data/quickcart.js"></script>
        <script src="/Data/cart.js"></script>
        
</body>
</html>
